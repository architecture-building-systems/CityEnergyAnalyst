# Final-energy KPIs (Energy by Carrier).
#
# Source CSV: scenario/outputs/data/analysis/{whatif_name}/final-energy/
#               final_energy_buildings.csv
# (one row per building or plant, produced by
# `cea final-energy`). Columns: per-carrier annual MWh for every
# carrier code (GRID, NATURALGAS, OIL, COAL, WOOD, DH, DC, SOLAR,
# PV) plus a TOTAL_MWh roll-up. The district totals (Total Final
# Energy, Fossil Fuel Share) and the PV analytics cards read the
# district hourly file `final_energy.csv` in the same folder instead:
# summing TOTAL_MWh over buildings and plants counts network heat and
# cold twice (the buildings' DH / DC and the plant's fuel).
#
# Moved / dropped:
#   - REPLACED `final_energy.solar_share_pct` ("Solar Share of Final
#     Energy", (PV + SOLAR) ÷ TOTAL) by
#     `final_energy.pv_generation_to_load_pct`; the old id is an
#     alias (`KPI_ALIASES` in `cea/kpi/registry.py`) so saved cards
#     keep working. It added heat and electricity MWh as equals, and
#     its SOLAR part counts DHW solar heat already inside TOTAL while
#     PV is not -- for PV it only approximated generation-to-load.
#
# `whatif_name` defaults to the empty string — the locator
# substitutes that into its path (`analysis//final-energy/...`),
# which `os.path.join` collapses to the baseline (no-what-if)
# folder. Districts running on a named what-if would override
# `locator_args.whatif_name` here. v1 ships against the baseline
# folder only; revise once the dashboard wires per-card what-if
# selection through to the KPI fetch.
#
# Picker grouping uses the existing `energy-by-carrier` plot key
# so each entry lands under "Life Cycle Analysis → Energy by
# Carrier" alongside the matching plot family.

feature: final_energy

kpis:
  - id: final_energy.total_final_mwh
    label: Total Final Energy
    category: energy-by-carrier
    unit: MWh/yr
    better_direction: lower
    headline: true
    info_note: |
      Total annual final energy entering the district, summed
      across every carrier (electricity, gas, oil, etc.).
      Heating and cooling from a district network are counted
      once, as the plant's fuel and electricity.

      Total = Σ(TOTAL_kWh) ÷ 1000
        in [MWh/yr]
    description: >
      Headline metric for energy by carrier. Pair with the per-
      carrier share KPIs to see the mix; drops as the supply
      system shifts away from fossil-driven services.
    source:
      locator: get_final_energy_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: aggregate
        op: sum
        of: { kind: column, name: TOTAL_kWh }
        scale: 0.001  # kWh -> MWh

  - id: final_energy.fossil_share_pct
    label: Fossil Fuel Share
    category: energy-by-carrier
    unit: '%'
    better_direction: lower
    info_note: |
      Share of total final energy from burning natural gas, oil
      or coal, in buildings or in district plants. The
      decarbonisation lever: swap fuel boilers for heat pumps /
      district heating to drive this towards 0.

      Share = Σ(NATURALGAS + OIL + COAL) ÷ Σ(TOTAL) × 100
        in [%]
    source:
      locator: get_final_energy_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: share_of
        part:
          kind: aggregate
          op: sum
          of:
            kind: sum_columns
            columns: [NATURALGAS_kWh, OIL_kWh, COAL_kWh]
        whole:
          kind: aggregate
          op: sum
          of: { kind: column, name: TOTAL_kWh }

  # ── Solar deployment KPIs ────────────────────────────────────────
  # Per-what-if PV / SC / PVT generation as it actually lands in
  # final-energy. These differ from the `solar.*` KPIs (which read
  # raw `cea photovoltaic` per-panel-type *potentials*) — these
  # reflect the configured deployment for the chosen what-if.
  # `PV_MWh` includes PV + PVT electrical halves; `SOLAR_MWh`
  # includes SC + PVT thermal halves (see
  # `cea/analysis/final_energy/calculation.py`).

  - id: final_energy.pv_generation_mwh
    label: Annual PV Generation
    category: energy-by-carrier
    unit: MWh/yr
    better_direction: higher
    info_note: |
      Annual PV electricity actually generated under this
      what-if's deployment configuration. Includes pure-PV
      panels and PVT panels' electrical half.

      PV = Σ(PV_MWh)
        in [MWh/yr]
    annotation: installed_pv_by_orientation
    source:
      locator: get_final_energy_buildings_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: aggregate
        op: sum
        of: { kind: column, name: PV_MWh }

  - id: final_energy.solar_thermal_mwh
    label: Annual Solar Thermal Generation
    category: energy-by-carrier
    unit: MWh/yr
    better_direction: higher
    info_note: |
      Annual solar thermal energy actually generated under this
      what-if's deployment configuration. Includes solar
      collectors (SC) and PVT panels' thermal half.

      Solar = Σ(SOLAR_MWh)
        in [MWh/yr]
    source:
      locator: get_final_energy_buildings_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: aggregate
        op: sum
        of: { kind: column, name: SOLAR_MWh }

  # ── PV analytics ─────────────────────────────────────────────────
  # Read the district hourly file `final_energy.csv` (PV_kWh against
  # GRID_kWh, plants included) and compute with the Summary &
  # Analytics code (`cea/analysis/final_energy/pv_analytics.py`), so
  # each card equals the summary's annual district value.

  - id: final_energy.pv_generation_to_load_pct
    label: PV Generation-to-Load
    category: energy-by-carrier
    unit: '%'
    better_direction: higher
    info_note: |
      Annual PV electricity (including PVT) as a share of the
      district's grid electricity use (services, boosters, heat
      pumps and plants) under this what-if's configuration. Above
      100% the district generates more than it uses over the year.

      Generation-to-load = Σ(PV) ÷ Σ(Use) × 100
        in [%]
    annotation: installed_pv_by_orientation
    source:
      locator: get_final_energy_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: pv_analytics
        metric: generation_to_load

  - id: final_energy.pv_self_consumption_pct
    label: PV Self-Consumption
    category: energy-by-carrier
    unit: '%'
    better_direction: higher
    info_note: |
      Share of on-site PV electricity (including PVT) used within
      the district rather than exported to the grid. PV and grid
      electricity use are matched hour by hour.

      Self-consumption = Σ_hours min(PV, Use) ÷ Σ(PV) × 100
        in [%]
    annotation: installed_pv_by_orientation
    source:
      locator: get_final_energy_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: pv_analytics
        metric: self_consumption

  - id: final_energy.pv_self_sufficiency_pct
    label: PV Self-Sufficiency
    category: energy-by-carrier
    unit: '%'
    better_direction: higher
    info_note: |
      Share of the district's grid electricity use (services,
      boosters, heat pumps and plants) covered by on-site PV
      (including PVT) as it is generated. PV and grid electricity
      use are matched hour by hour.

      Self-sufficiency = Σ_hours min(PV, Use) ÷ Σ(Use) × 100
        in [%]
    annotation: installed_pv_by_orientation
    source:
      locator: get_final_energy_file
      locator_args:
        whatif_name: ""
      parameters:
        whatif_name:
          label: What-if scenario
          options_generator: whatif_names
          default: ""
          description: Which what-if folder to read final-energy outputs from.
      formula:
        kind: pv_analytics
        metric: self_sufficiency
