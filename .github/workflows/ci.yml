name: CI
# Runs unit and integration tests
# Only triggered on source code and dependency updates

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [master, release-**]
    # Ignore changes in the interfaces directory since they do not have tests
    # TODO: Add tests for interfaces module
    paths: 
      - 'cea/**'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '!cea/interfaces/**'
      - '!**/*.md'

  push:
    branches: [master]
    paths: 
      - 'cea/**'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '!cea/interfaces/**'
      - '!**/*.md'

concurrency:
  # Use head_ref for PRs, fall back to ref for pushes
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only cancel in-progress jobs for PRs, not for pushes to master
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # wntr does not support linux ARM (no EPANET ARM binaries)
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          pixi-version: v0.72.0

      - name: Install CEA
        run: pixi run pip install . --group dev

      - name: Run unit tests
        run: pixi run unittest

      - name: Run integration tests
        if: github.event.pull_request.draft == false
        run: pixi run integration

      - name: Record pythonocc version
        if: ${{ !cancelled() && github.event.pull_request.draft == false }}
        run: pixi list pythonocc-core

      - name: Collect radiation outputs for cross-OS comparison
        if: ${{ !cancelled() && github.event.pull_request.draft == false }}
        run: pixi run python .github/scripts/compare_radiation.py collect radiation-artifacts

      - name: Upload radiation outputs
        if: ${{ !cancelled() && github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@v7
        with:
          name: radiation-${{ matrix.os }}
          path: radiation-artifacts/
          retention-days: 3
          if-no-files-found: warn

      - name: List test scenario locations (on failure)
        if: failure()
        shell: bash
        run: |
          echo "Searching for test scenario outputs..."
          ls -la ~ || true
          find ~ -maxdepth 2 -type d \( -name "zug_heating" -o -name "sg_cooling" \) 2>/dev/null || echo "No test scenarios found"

      - name: Upload test scenario artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-scenarios-${{ matrix.os }}
          path: |
              ${{ env.HOME }}/zug_heating/
              ${{ env.HOME }}/sg_cooling/
          retention-days: 3
          if-no-files-found: warn

  compare-radiation:
    # Advisory: report sensor mesh / PV selection differences between OSes in the job summary
    needs: tests
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install comparison dependencies
        run: pip install pandas numpy

      - name: Download radiation outputs
        uses: actions/download-artifact@v8
        with:
          pattern: radiation-*
          path: radiation-artifacts

      - name: Compare radiation outputs across OSes
        run: python .github/scripts/compare_radiation.py compare radiation-artifacts
